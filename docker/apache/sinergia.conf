<VirtualHost *:8080>
    DocumentRoot /var/www/app/public
    ServerSignature Off

    <Directory /var/www/app/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    # Somente public/ é servido; código, .env e storage ficam fora do DocumentRoot.
    ErrorLog /proc/self/fd/2

    # /oauth/* recebe code e state na query: essas requisições são registradas sem a query
    # e sem o Referer (a página de autorização do Mercado Livre também leva o state na URL).
    SetEnvIf Request_URI "^/oauth/" sinergia_oauth
    LogFormat "%h %l %u %t \"%m %U [query omitida] %H\" %>s %O \"-\" \"%{User-Agent}i\"" sinergia_oauth_redacted
    CustomLog /proc/self/fd/1 combined env=!sinergia_oauth
    CustomLog /proc/self/fd/1 sinergia_oauth_redacted env=sinergia_oauth
</VirtualHost>
